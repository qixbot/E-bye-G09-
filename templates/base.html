<!-- Xingru part -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bye — MMU Campus Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- TOP Navigation bar -->
    {% block navbar %}
    <nav class="top-navbar">
        <a href="{{ url_for('home') }}" class="nav-site">
            <img src="{{ url_for('static', filename='ebye-logo.png') }}" alt="E-bye Logo" class="site-logo">
            <span class="site-name">E-bye</span>
        </a>
        
        <form action="{{ url_for('search') }}" method="GET" class="nav-search">
            <a href="{{ url_for('search') }}" class="search-icon" style="text-decoration:none;">🔍</a>
            <input type="text" name="q" placeholder="Search products or users..." class="search-input">
            <input type="hidden" name="category" id="search-category-input">
            <input type="hidden" name="condition" id="search-condition-input">
            <input type="hidden" name="min_price" id="search-min-price">
            <input type="hidden" name="max_price" id="search-max-price">
            <input type="hidden" name="sort" id="search-sort">
            <input type="hidden" name="date_range" id="search-date-range">
        </form>
        
        <div class="nav-profile">
            <a href="/chatlist" class="nav-icon-btn" title="Chatlist & Notifications" style="position:relative;">
    <img src="{{ url_for('static', filename='chat-icon_Ver2.png') }}" class="nav-icon-img" alt="Chat">
    <span id="chatBadge" style="display:none;position:absolute;top:-2px;right:-4px;background:#e74c3c;color:white;border-radius:50%;min-width:14px;height:14px;font-size:9px;font-weight:bold;text-align:center;line-height:14px;padding:0 3px;"></span>
</a>
            <a href="{{ url_for('edit_profile') }}" style="text-decoration: none; display: flex; align-items: center;">
                <img src="{% if session.get('user_id') %}{{ url_for('user_avatar', user_id=session.get('user_id')) }}{% endif %}" class="nav-avatar-img"
    alt="Avatar"
    onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="nav-avatar" style="display: none;">
                    {% if session.get('username') %}
                        {{ session['username'][0].upper() }}
                    {% else %}
                        X
                    {% endif %}
                </div>
            </a>
        </div>
    </nav>
    {% endblock %}
    
    <!-- TOP Navigation bar end -->

    {% block content %}{% endblock %}
    
    <!-- BOTTOM Navigation bar -->
    {% block bottom_nav %}
    <div class="bottom-nav-spacer"></div>
    
    <nav class="bottom-nav">
        <a href="{{ url_for('home') }}" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Home</span>
        </a>
        
        <a href="{{ url_for('shopping_cart') }}" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span class="nav-text">Cart</span>
        </a>
        
        <div class="post-btn-wrapper">
            <a href="{{ url_for('upload_product') }}" class="post-btn">
                <span class="nav-icon plus-icon">+</span>
                <span class="nav-text">Post</span>
            </a>
        </div>

        <a href="{{ url_for('my_profile') }}" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-text">Profile</span>
        </a>

        <a href="{{ url_for('meetup_locations') }}" class="nav-item">
            <span class="nav-icon">📍</span>
            <span class="nav-text">Meetup</span>
        </a>
    </nav>
    {% endblock %}
    <!-- BOTTOM Navigation bar end -->
     
    <script>
        function showGlobalToast(message, type = 'success') {
            const existing = document.querySelector('.toast-container');
            if (existing) existing.remove();

            const container = document.createElement('div');
            container.className = 'toast-container';

            const toastDiv = document.createElement('div');
            toastDiv.className = `toast toast-${type}`;
            toastDiv.textContent = message;

            container.appendChild(toastDiv);
            document.body.appendChild(container);

            setTimeout(() => {
                if (container) container.remove();
            }, 3000);
        }
    </script>
    <script>
(function() {
    let lastUpdate = 0;
    let pending = false;
    
    function updateBadge() {
        // 防止过于频繁
        const now = Date.now();
        if (now - lastUpdate < 3000 || pending) return;
        
        pending = true;
        lastUpdate = now;
        
        fetch('/api/unread-count', {
            method: 'GET',
            headers: { 'Cache-Control': 'no-cache' }
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var badge = document.getElementById('chatBadge');
            if (!badge) return;
            var total = (d.chat || 0) + (d.notifications || 0);
            if (total > 0) {
                badge.textContent = total > 99 ? '99+' : total;
                badge.style.display = 'block';
            } else { 
                badge.style.display = 'none'; 
            }
        })
        .catch(function(e) { console.log('Badge error:', e); })
        .finally(function() { pending = false; });
    }
    
    // 页面加载后延迟3秒执行，每60秒一次
    setTimeout(updateBadge, 3000);
    setInterval(updateBadge, 60000);
    
    // 页面可见时立即更新
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            lastUpdate = 0; // 重置，允许立即请求
            updateBadge();
        }
    });
})();
</script>

</body>
</html>
