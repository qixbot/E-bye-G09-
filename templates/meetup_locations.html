{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='meetup_locations.css') }}">

<div class="meetup-page">
    <div class="campus-tabs">
        <button class="campus-btn active" id="btnCyberjaya">Cyberjaya</button>
        <button class="campus-btn" id="btnMelaka">Melaka</button>
    </div>
    <div id="locationsContainer" class="locations-grid">
        <!-- location cards inserted by JavaScript -->
    </div>
</div>

<script>
    // Cyberjaya locations (same as product modal)
    const cyberjayaLocations = [
        { name: "Library", image: "/static/uploads/library.jpg" },
        { name: "DTC", image: "/static/uploads/dtc.jpg" },
        { name: "Starbees", image: "/static/uploads/starbees.jpg" },
        { name: "CLC", image: "/static/uploads/clc.jpg" },
        { name: "FCI", image: "/static/uploads/fci.jpg" },
        { name: "FOM", image: "/static/uploads/fom.jpg" },
        { name: "FAIE", image: "/static/uploads/faie.jpg" },
        { name: "FCM", image: "/static/uploads/fcm.jpg" },
        { name: "STC", image: "/static/uploads/stc.jpg" },
        { name: "HB1", image: "/static/uploads/hb1.jpg" },
        { name: "HB2", image: "/static/uploads/hb2.jpg" },
        { name: "HB3", image: "/static/uploads/hb3.jpg" },
        { name: "HB4", image: "/static/uploads/hb4.jpg" },
        { name: "Masjid", image: "/static/uploads/masjid.jpg" },
        { name: "Tekun Mart", image: "/static/uploads/tekun_mart.jpg" },
        { name: "Chancellery Building", image: "/static/uploads/chancellery.jpg" }
    ];

    // Melaka locations (placeholders – replace names and images later)
    const melakaLocations = [
        { name: "Library (Melaka)", image: "/static/uploads/library.jpg" },
        { name: "Dewan Tun Canselor", image: "/static/uploads/dtc.jpg" },
        { name: "Cafeteria", image: "/static/uploads/starbees.jpg" },
        { name: "Block A", image: "/static/uploads/clc.jpg" },
        { name: "Block B", image: "/static/uploads/fci.jpg" },
        { name: "Block C", image: "/static/uploads/fom.jpg" },
        { name: "Block D", image: "/static/uploads/faie.jpg" },
        { name: "Block E", image: "/static/uploads/fcm.jpg" },
        { name: "Sports Complex", image: "/static/uploads/stc.jpg" },
        { name: "Hostel 1", image: "/static/uploads/hb1.jpg" },
        { name: "Hostel 2", image: "/static/uploads/hb2.jpg" },
        { name: "Hostel 3", image: "/static/uploads/hb3.jpg" },
        { name: "Hostel 4", image: "/static/uploads/hb4.jpg" },
        { name: "Surau", image: "/static/uploads/masjid.jpg" },
        { name: "Mini Mart", image: "/static/uploads/tekun_mart.jpg" },
        { name: "Admin Building", image: "/static/uploads/chancellery.jpg" }
    ];

    let currentCampus = 'cyberjaya';

    function renderLocations() {
        const container = document.getElementById('locationsContainer');
        const locations = currentCampus === 'cyberjaya' ? cyberjayaLocations : melakaLocations;
        container.innerHTML = '';
        locations.forEach(loc => {
            const card = document.createElement('div');
            card.className = 'location-card';
            card.innerHTML = `
                <img src="${loc.image}" class="location-img" alt="${loc.name}">
                <div class="location-label">${loc.name}</div>
            `;
            container.appendChild(card);
        });
    }

    document.getElementById('btnCyberjaya').addEventListener('click', () => {
        currentCampus = 'cyberjaya';
        document.getElementById('btnCyberjaya').classList.add('active');
        document.getElementById('btnMelaka').classList.remove('active');
        renderLocations();
    });
    document.getElementById('btnMelaka').addEventListener('click', () => {
        currentCampus = 'melaka';
        document.getElementById('btnMelaka').classList.add('active');
        document.getElementById('btnCyberjaya').classList.remove('active');
        renderLocations();
    });

    renderLocations();
</script>
{% endblock %}
