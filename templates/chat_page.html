<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - {{ other_user.username }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6f5; }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: #fff;
        }

        /* Navigation Bar */
        .chat-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #205c30;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 25px;
            background: #eaf4ed;
            margin-right: 12px;
            transition: 0.2s;
        }
        .back-btn:hover { background: #d4e8d8; }
        
        /* Avatar */
        .avatar-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #205c30;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        .header-info { flex: 1; }
        .header-name { font-weight: 700; font-size: 18px; margin-bottom: 4px; }
        .header-status { font-size: 12px; }
        .header-status.online { color: #27ae60; }
        .header-status.offline { color: #888; }

        .report-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            color: #888;
            transition: 0.2s;
        }
        .report-btn:hover { background: #fee; color: #e74c3c; border-color: #e74c3c; }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f6f5;
        }
        .msg-row { margin-bottom: 16px; display: flex; flex-direction: column; }
        .msg-row.right { align-items: flex-end; }
        .msg-row.left { align-items: flex-start; }

        .date-divider {
            text-align: center;
            margin: 20px 0 16px;
        }
        .date-divider span {
            background: rgba(0,0,0,0.08);
            color: #666;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        /* message bubble */
        .msg-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.45;
            word-break: break-word;
        }
        .msg-bubble.sent { background: #205c30; color: white; border-bottom-right-radius: 4px; }
        .msg-bubble.received { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-bubble img { max-width: 200px; border-radius: 8px; margin: 4px 0; cursor: pointer; display: block; }
        
        .product-card-link { text-decoration: none; display: block; }
        .product-preview {
            background: #f0f7f2;
            border-radius: 12px;
            padding: 12px;
            max-width: 260px;
            border: 1px solid #d4e8d8;
        }
        .product-preview-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #1a1a1a; }
        .product-preview-price { color: #205c30; font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .product-preview-link { font-size: 11px; color: #205c30; text-decoration: underline; }
        
        .msg-meta { 
            font-size: 11px; 
            color: #999; 
            margin-top: 4px; 
            padding: 0 6px;
            display: flex;
            gap: 8px;
        }

        .input-bar {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid #e0e0e0;
            gap: 10px;
            background: #fff;
            position: sticky;
            bottom: 0;
        }
        .input-bar button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-bar button:hover { background: #f0f0f0; }
        .input-bar input[type="text"] {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 28px;
            padding: 12px 18px;
            font-size: 16px;
            outline: none;
            background: #f9f9f9;
            transition: all 0.2s;
        }
        .input-bar input[type="text"]:focus {
            border-color: #205c30;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(32,92,48,0.1);
        }
        .btn-send {
            background: #205c30 !important;
            color: white !important;
            padding: 10px 22px !important;
            border-radius: 28px !important;
            font-size: 15px !important;
            font-weight: 600;
            width: auto !important;
        }
        .btn-send:hover { background: #0e3a1a !important; transform: scale(1.02); }

        #imageInput { display: none; }
        .image-preview { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; background: #f9f9f9; }
        .image-preview-item { position: relative; display: inline-block; }
        .image-preview-img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        .remove-preview {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .emoji-panel {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: #fff;
            border-top: 1px solid #eee;
            max-height: 140px;
            overflow-y: auto;
        }
        .emoji-panel.show { display: flex; }
        .emoji-panel span {
            font-size: 24px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .emoji-panel span:hover { background: #f0f0f0; }

        .image-preview-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .image-preview-overlay.show { display: flex; }
        .image-preview-overlay img { max-width: 95%; max-height: 95%; border-radius: 8px; }

        .report-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .report-modal.show { display: flex; }
        .report-box {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 380px;
        }
        .report-box h3 { margin-bottom: 16px; font-size: 18px; }
        .report-box textarea {
            width: 100%;
            height: 80px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 10px;
            font-size: 14px;
            resize: none;
        }
        .report-box select {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #ddd;
            margin-bottom: 12px;
        }
        .report-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        
        .loading-messages {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* Product Selector */
        .product-picker {
            display: none;
            padding: 12px 16px;
            background: #f0f7f2;
            border-bottom: 1px solid #d4e8d8;
        }
        .product-picker.show { display: block; }
        .product-picker select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .product-picker button {
            margin-top: 8px;
            background: #205c30;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <a href="{{ url_for('chat_list') }}" class="back-btn">◀ Back</a>
        <div class="avatar-circle">
            <img class="avatar-img" src="{{ url_for('user_avatar', user_id=other_user.id) }}" 
                 onerror="this.style.display='none';">
            <span>{{ other_user.username[0].upper() }}</span>
        </div>
        <div class="header-info">
            <div class="header-name">{{ other_user.full_name or other_user.username }}</div>
            <div class="header-status" id="userStatus">Loading...</div>
        </div>
        <button class="report-btn" onclick="openReportModal()">⚠️ Report</button>
    </div>

    <div class="messages-area" id="chatMessages">
        <div class="loading-messages">Loading messages...</div>
    </div>

    <div class="product-picker" id="productPicker">
        <select id="productSelect"><option value="">Select a product...</option></select>
        <div>
            <button onclick="sendSelectedProduct()">Send Product Info</button>
            <button onclick="closeProductPicker()" style="background:#999;">Cancel</button>
        </div>
    </div>

    <div class="emoji-panel" id="emojiPanel">
        <span onclick="insertEmoji('😀')">😀</span><span onclick="insertEmoji('😂')">😂</span>
        <span onclick="insertEmoji('😍')">😍</span><span onclick="insertEmoji('🥰')">🥰</span>
        <span onclick="insertEmoji('😎')">😎</span><span onclick="insertEmoji('🤩')">🤩</span>
        <span onclick="insertEmoji('👍')">👍</span><span onclick="insertEmoji('❤️')">❤️</span>
        <span onclick="insertEmoji('🔥')">🔥</span><span onclick="insertEmoji('🎉')">🎉</span>
        <span onclick="insertEmoji('💯')">💯</span><span onclick="insertEmoji('✅')">✅</span>
        <span onclick="insertEmoji('👋')">👋</span><span onclick="insertEmoji('🙏')">🙏</span>
        <span onclick="insertEmoji('💪')">💪</span><span onclick="insertEmoji('📦')">📦</span>
        <span onclick="insertEmoji('💰')">💰</span><span onclick="insertEmoji('💬')">💬</span>
    </div>

    <div class="image-preview" id="imagePreviewBar"></div>

    <div class="input-bar">
        <input type="file" id="imageInput" accept="image/*" multiple style="display:none" onchange="previewImages()">
        <button onclick="document.getElementById('imageInput').click()" title="Photo">🖼️</button>
        <button onclick="toggleEmoji()" title="Emoji">😀</button>
        <button onclick="openProductPicker()" title="Send Product">📦</button>
        <input type="text" id="msgInput" placeholder="Message..." onkeypress="handleEnterKey(event)">
        <button class="btn-send" onclick="sendMsg()">Send</button>
    </div>
</div>

<div class="image-preview-overlay" id="imagePreviewOverlay" onclick="this.classList.remove('show')">
    <img id="previewImg" src="">
</div>

<div class="report-modal" id="reportModal">
    <div class="report-box">
        <h3>⚠️ Report {{ other_user.username }}</h3>
        <select id="reportReason">
            <option value="Spam">Spam</option>
            <option value="Harassment">Harassment</option>
            <option value="Fake item">Fake item</option>
            <option value="Inappropriate">Inappropriate content</option>
            <option value="Other">Other</option>
        </select>
        <textarea id="reportDetails" placeholder="Add details (optional)..."></textarea>
        <div class="report-actions">
            <button onclick="closeReportModal()" style="background:#eee; border:none; padding:8px 16px; border-radius:12px; cursor:pointer;">Cancel</button>
            <button onclick="submitReport()" style="background:#e74c3c; color:white; border:none; padding:8px 16px; border-radius:12px; cursor:pointer;">Submit Report</button>
        </div>
    </div>
</div>

<script>
var otherId = {{ other_user.id }};
var currentUserId = {{ session['user_id'] }};
var selectedFiles = [];
var lastMessageId = 0;

// ============================================================
// Time Formatting - Display Local Time (12-hour format AM/PM）
// ============================================================
function formatChatTime(dateStr) {
    if (!dateStr) return '';
    
    // Convert the string to a Date and add the time zone offset
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    
    // Add 8 hours (Malaysia Time Zone UTC+8)
    var localTime = new Date(d.getTime() + 8 * 60 * 60 * 1000);
    
    var hours = localTime.getHours();
    var minutes = localTime.getMinutes().toString().padStart(2, '0');
    var ampm = hours >= 12 ? 'PM' : 'AM';
    var hours12 = hours % 12 || 12;
    
    return hours12 + ':' + minutes + ' ' + ampm;
}

function formatFullDateTime(dateStr) {
    if (!dateStr) return 'Unknown';
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    
    return d.toLocaleString('en-US', { 
        year: 'numeric', 
        month: '2-digit', 
        day: '2-digit',
        hour: 'numeric', 
        minute: '2-digit',
        hour12: true
    });
}

function formatDateDivider(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    var now = new Date();
    
    if (isNaN(d.getTime())) return '';
    
    if (d.toDateString() === now.toDateString()) {
        return 'Today';
    }
    var yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) {
        return 'Yesterday';
    }
    return d.toLocaleDateString('en-MY', { 
        year: 'numeric', 
        month: '2-digit', 
        day: '2-digit' 
    });
}

// ============================================================
// Render message
// ============================================================
function renderMessages(messages) {
    var container = document.getElementById('chatMessages');
    if (!container) return;
    
    if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="loading-messages">💬 No messages yet. Say hi!</div>';
        return;
    }
    
    var html = '';
    var lastDate = '';
    
    for (var i = 0; i < messages.length; i++) {
        var msg = messages[i];
        var msgDate = formatDateDivider(msg.created_at);
        
        if (msgDate !== lastDate) {
            html += '<div class="date-divider"><span>' + msgDate + '</span></div>';
            lastDate = msgDate;
        }
        
        var isSent = (msg.sender_id === currentUserId);
        
        html += '<div class="msg-row ' + (isSent ? 'right' : 'left') + '">';
        html += '<div class="msg-bubble ' + (isSent ? 'sent' : 'received') + '">';
        
        if (msg.image) {
            var images = msg.image.split(',');
            for (var j = 0; j < images.length; j++) {
                var imgSrc = images[j].trim();
                if (!imgSrc.startsWith('http') && !imgSrc.startsWith('data:')) {
                    imgSrc = '/static/uploads/' + imgSrc;
                }
                html += '<img src="' + escapeHtml(imgSrc) + '" onclick="previewImage(this.src)">';
            }
        }
        
        var messageContent = msg.content || '';
        if (messageContent.includes('/product/')) {
            html += messageContent;
        } else {
            html += escapeHtml(messageContent);
        }
        
        html += '</div>';
        html += '<div class="msg-meta">';
        html += formatChatTime(msg.created_at);
        if (isSent) {
            html += msg.is_read ? ' ✓✓ Read' : ' ✓ Sent';
        }
        html += '</div>';
        html += '</div>';
        
        if (msg.id > lastMessageId) lastMessageId = msg.id;
    }
    
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
}

function loadMessages() {
    fetch('/api/chat/messages/' + otherId + '?since=0', { credentials: 'same-origin' })
    .then(function(r) { return r.json(); })
    .then(function(messages) {
        renderMessages(messages);
    })
    .catch(function(err) { console.log('Load error:', err); });
}

// ============================================================
// Send message
// ============================================================
function sendMsg() {
    var input = document.getElementById('msgInput');
    var text = input.value.trim();
    
    if (!text && selectedFiles.length === 0) return;
    
    if (selectedFiles.length > 0) {
        sendImages();
    } else {
        fetch('/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ receiver_id: otherId, content: text }),
            credentials: 'same-origin'
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                input.value = '';
                loadMessages();
            }
        });
    }
}

function sendImages() {
    var formData = new FormData();
    for (var i = 0; i < selectedFiles.length; i++) {
        formData.append('images', selectedFiles[i]);
    }
    formData.append('receiver_id', otherId);
    formData.append('content', document.getElementById('msgInput').value.trim());
    
    fetch('/chat/send-images', {
        method: 'POST',
        body: formData,
        credentials: 'same-origin'
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.success) {
            document.getElementById('msgInput').value = '';
            selectedFiles = [];
            document.getElementById('imagePreviewBar').innerHTML = '';
            loadMessages();
        }
    });
}

function previewImages() {
    var files = document.getElementById('imageInput').files;
    selectedFiles = [];
    var bar = document.getElementById('imagePreviewBar');
    bar.innerHTML = '';
    var max = Math.min(files.length, 3);
    
    for (var i = 0; i < max; i++) {
        selectedFiles.push(files[i]);
        (function(file, idx) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var div = document.createElement('div');
                div.className = 'image-preview-item';
                div.innerHTML = '<img src="' + e.target.result + '" class="image-preview-img">' +
                    '<button class="remove-preview" onclick="removeImage(' + idx + ')">✕</button>';
                bar.appendChild(div);
            };
            reader.readAsDataURL(files[i]);
        })(files[i], i);
    }
}

function removeImage(index) {
    selectedFiles.splice(index, 1);
    previewImages();
}

// ============================================================
// Product Selector
// ============================================================
function openProductPicker() {
    var picker = document.getElementById('productPicker');
    picker.classList.toggle('show');
    if (picker.classList.contains('show')) {
        fetch('/api/user/' + otherId + '/listings')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var select = document.getElementById('productSelect');
            select.innerHTML = '<option value="">Select a product...</option>';
            data.forEach(function(p) {
                if (p.status === 'approved') {
                    select.innerHTML += '<option value="' + p.id + '">' + p.name + ' (RM ' + parseFloat(p.price).toFixed(2) + ')</option>';
                }
            });
        });
    }
}

function closeProductPicker() {
    document.getElementById('productPicker').classList.remove('show');
}

function sendSelectedProduct() {
    var select = document.getElementById('productSelect');
    var pid = select.value;
    if (!pid) {
        alert('Please select a product first');
        return;
    }
    var option = select.options[select.selectedIndex];
    var text = option.text;
    var priceMatch = text.match(/RM [\d.]+/);
    var price = priceMatch ? priceMatch[0] : 'RM 0.00';
    var name = text.replace(price, '').replace('()', '').trim();
    var link = '/product/' + pid;
    
    var cardHtml = '<a href="' + link + '" class="product-card-link">' +
        '<div class="product-preview">' +
        '<div class="product-preview-name">📦 ' + escapeHtml(name) + '</div>' +
        '<div class="product-preview-price">' + price + '</div>' +
        '<div class="product-preview-link">Tap to view product →</div>' +
        '</div></a>';
    
    fetch('/chat/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ receiver_id: otherId, product_id: parseInt(pid), content: cardHtml }),
        credentials: 'same-origin'
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.success) {
            closeProductPicker();
            loadMessages();
        }
    });
}

// ============================================================
// Emojis and Enter
// ============================================================
function toggleEmoji() {
    document.getElementById('emojiPanel').classList.toggle('show');
}

function insertEmoji(emoji) {
    var input = document.getElementById('msgInput');
    input.value += emoji;
    input.focus();
}

function handleEnterKey(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMsg();
    }
}

function previewImage(src) {
    document.getElementById('previewImg').src = src;
    document.getElementById('imagePreviewOverlay').classList.add('show');
}

// ============================================================
// Report
// ============================================================
function openReportModal() {
    document.getElementById('reportModal').classList.add('show');
}

function closeReportModal() {
    document.getElementById('reportModal').classList.remove('show');
}

function submitReport() {
    var reason = document.getElementById('reportReason').value;
    var details = document.getElementById('reportDetails').value.trim();
    
    fetch('/report-user/' + otherId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason: reason, details: details }),
        credentials: 'same-origin'
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.success) {
            alert('Report submitted. Thank you.');
            closeReportModal();
        } else {
            alert('Failed to submit report');
        }
    });
}

// ============================================================
// Online Status - Display Accurate Last Seen Time
// ============================================================
function updateUserStatus() {
    fetch('/api/user/' + otherId + '/status', { credentials: 'same-origin' })
    .then(function(r) { 
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json(); 
    })
    .then(function(data) {
        console.log('Status data:', data);
        var statusEl = document.getElementById('userStatus');
        
        var isOnline = (data.online === true || data.online === 'true' || data.online === 1);
        
        if (isOnline) {
            statusEl.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#27ae60;margin-right:6px;"></span> Online';
            statusEl.className = 'header-status online';
        } else {
            var lastSeenText = 'Offline';
            if (data.last_seen) {
                try {
                    var lastSeenDate = new Date(data.last_seen);
                    if (!isNaN(lastSeenDate.getTime())) {
                        var now = new Date();
                        var diffSeconds = Math.floor((now - lastSeenDate) / 1000);
                        
                        if (diffSeconds < 60) {
                            lastSeenText = 'Last seen just now';
                        } else if (diffSeconds < 3600) {
                            var mins = Math.floor(diffSeconds / 60);
                            lastSeenText = 'Last seen ' + mins + ' min ago';
                        } else if (diffSeconds < 86400) {
                            var hours = Math.floor(diffSeconds / 3600);
                            lastSeenText = 'Last seen ' + hours + ' hours ago';
                        } else if (diffSeconds < 604800) {
                            var days = Math.floor(diffSeconds / 86400);
                            lastSeenText = 'Last seen ' + days + ' days ago';
                        } else {
                            lastSeenText = 'Last seen ' + lastSeenDate.toLocaleDateString();
                        }
                    } else {
                        lastSeenText = 'Last seen: ' + data.last_seen;
                    }
                } catch(e) {
                    console.error('Date parse error:', e);
                    lastSeenText = 'Offline';
                }
            }
            statusEl.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#888;margin-right:6px;"></span> ' + lastSeenText;
            statusEl.className = 'header-status offline';
        }
    })
    .catch(function(err) {
        console.error('Status fetch error:', err);
        document.getElementById('userStatus').innerHTML = '● Offline';
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ============================================================
// Initialization
// ============================================================
function init() {
    loadMessages();
    updateUserStatus();
    setInterval(updateUserStatus, 30000);
    setInterval(function() {
        fetch('/api/chat/messages/' + otherId + '?since=' + lastMessageId, { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(messages) {
            if (messages && messages.length > 0) loadMessages();
        });
    }, 3000);
}

init();
</script>
