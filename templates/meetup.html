{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='meetup.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='product.css') }}">

<div class="meetup-page">
    <div class="campus-tabs">
        <button class="campus-btn active" id="btnCyberjaya">Cyberjaya</button>
        <button class="campus-btn" id="btnMelaka">Melaka</button>
    </div>
    <div id="locationsContainer" class="locations-grid">
        <!-- location cards inserted by JavaScript -->
    </div>

    <!-- Location Detail Modal -->
    <div id="locationModal" class="modal" style="display: none;">
        <div class="modal-content buy-modal-content" style="max-width: 1100px; width: 90%;">
            <span class="close" onclick="closeLocationModal()">&times;</span>

            <div class="buy-modal-two-columns">
                <!-- LEFT COLUMN – image carousel -->
                <div class="buy-modal-left" style="position: relative;">
                    <div class="product-image-preview" id="modalLocationImage">
                        <img src="" alt="Location image" style="width:100%; height:100%; object-fit: cover;">
                    </div>
                    <button class="media-nav-prev" id="modalPrevBtn" onclick="prevLocationImage()" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer;">‹</button>
                    <button class="media-nav-next" id="modalNextBtn" onclick="nextLocationImage()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer;">›</button>
                </div>

                <!-- RIGHT COLUMN – details -->
                <div class="buy-modal-right" style="overflow-y: auto; max-height: 70vh;">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                        <button id="googleMapsBtn" class="map-icon-btn" onclick="openGoogleMaps()">
                            <span style="font-size: 1.2rem;">🗺️</span>
                        </button>
                        <span id="modalShortName" style="font-size: 0.9rem; color: #666;">Short name</span>
                    </div>
                    <h3 id="modalFullName" style="margin: 0 0 8px 0; font-size: 1.5rem;">Full Name</h3>
                    <hr style="margin: 12px 0;">
                    <p id="modalDescription" style="color: #555; line-height: 1.5; font-size: 0.9rem;">Description goes here...</p>
                </div>
            </div>
        </div>
    </div>
</div>

    let currentCampus = 'cyberjaya';
    const campusImages = {
        cyberjaya: "/static/uploads/cyberjaya_feature.jpg",   // change to your actual image file
        melaka: "/static/uploads/melaka_feature.jpg"         // change to your actual image file
    };

    function renderLocations() {
        const container = document.getElementById('locationsContainer');
        const locations = currentCampus === 'cyberjaya' ? cyberjayaLocations : melakaLocations;
        container.innerHTML = '';
        
        // 1) Create the big square image (will span 2x2 grid cells)
        const featureDiv = document.createElement('div');
        featureDiv.className = 'campus-feature';
        const featureImg = document.createElement('img');
        featureImg.src = campusImages[currentCampus];
        featureImg.alt = currentCampus.toUpperCase() + ' Campus';
        featureDiv.appendChild(featureImg);
        container.appendChild(featureDiv);
        
        // 2) Add all location cards
        locations.forEach(loc => {
            const card = document.createElement('div');
            card.className = 'location-card';
            card.innerHTML = `
                <img src="${loc.images[0]}" class="location-img" alt="${loc.shortName}">
                <div class="location-label">${loc.shortName}</div>
            `;
            card.addEventListener('click', () => openLocationModal(loc));
            container.appendChild(card);
        });
    }

    document.getElementById('btnCyberjaya').addEventListener('click', () => {
        currentCampus = 'cyberjaya';
        document.getElementById('btnCyberjaya').classList.add('active');
        document.getElementById('btnMelaka').classList.remove('active');
        renderLocations();
    });
    document.getElementById('btnMelaka').addEventListener('click', () => {
        currentCampus = 'melaka';
        document.getElementById('btnMelaka').classList.add('active');
        document.getElementById('btnCyberjaya').classList.remove('active');
        renderLocations();
    });

    renderLocations();

    let currentLocationData = null;
    let currentImageIndex = 0;

    function openLocationModal(location) {
        currentLocationData = location;
        currentImageIndex = 0;
        document.getElementById('modalShortName').innerText = location.shortName;
        document.getElementById('modalFullName').innerText = location.fullName;
        document.getElementById('modalDescription').innerText = location.description;
        document.getElementById('googleMapsBtn').setAttribute('data-map-url', location.mapUrl);
        updateModalImage();
        // Hide navigation buttons if only one image
        const hasMultiple = location.images && location.images.length > 1;
        document.getElementById('modalPrevBtn').style.display = hasMultiple ? 'flex' : 'none';
        document.getElementById('modalNextBtn').style.display = hasMultiple ? 'flex' : 'none';
        document.getElementById('locationModal').style.display = 'flex';
    }

    function closeLocationModal() {
        document.getElementById('locationModal').style.display = 'none';
    }

    function updateModalImage() {
        const imgElement = document.querySelector('#modalLocationImage img');
        if (currentLocationData && currentLocationData.images && currentLocationData.images.length > 0) {
            imgElement.src = currentLocationData.images[currentImageIndex];
        } else {
            imgElement.src = '/static/uploads/placeholder.jpg';
        }
    }

    function prevLocationImage() {
        if (!currentLocationData || !currentLocationData.images) return;
        if (currentLocationData.images.length <= 1) return;
        currentImageIndex = (currentImageIndex - 1 + currentLocationData.images.length) % currentLocationData.images.length;
        updateModalImage();
    }

    function nextLocationImage() {
        if (!currentLocationData || !currentLocationData.images) return;
        if (currentLocationData.images.length <= 1) return;
        currentImageIndex = (currentImageIndex + 1) % currentLocationData.images.length;
        updateModalImage();
    }

    function openGoogleMaps() {
        const mapUrl = document.getElementById('googleMapsBtn').getAttribute('data-map-url');
        if (mapUrl) {
            window.open(mapUrl, '_blank');
        }
    }

    window.onclick = function(event) {
        const modal = document.getElementById('locationModal');
        if (event.target === modal) {
            closeLocationModal();
        }
    };
